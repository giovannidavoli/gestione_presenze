<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>{% if dipendente.id %}Modifica{% else %}Nuovo{% endif %} Dipendente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Un po' di stile per rendere il form generato da Django più carino */
        input,
        select,
        textarea {
            display: block;
            width: 100%;
            padding: 0.375rem 0.75rem;
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.5;
            color: #212529;
            background-color: #fff;
            border: 1px solid #ced4da;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
        }

        label {
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .helptext {
            font-size: 0.875em;
            color: #6c757d;
            display: block;
            margin-top: -0.8rem;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body class="bg-light">
    <div class="container mt-5 mb-5">
        <div class="card shadow" style="max-width: 800px; margin: auto;">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">{% if dipendente.id %}Modifica{% else %}Nuovo{% endif %} Dipendente - {{
                    azienda.ragione_sociale }}</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <hr class="mt-4">
                    <div class="text-end">
                        <a href="{% url 'lista_dipendenti' azienda.id %}" class="btn btn-secondary me-2">Annulla</a>
                        <button type="submit" class="btn btn-success">Salva Dipendente</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
